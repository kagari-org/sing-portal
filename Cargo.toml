[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/store",
  "crates/server",
  "crates/agent",
  "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
sing-portal-core = { path = "crates/core" }
sing-portal-store = { path = "crates/store" }
sing-portal-server = { path = "crates/server" }
sing-portal-agent = { path = "crates/agent" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
futures-util = "0.3"
http-body-util = "0.1"
mime_guess = "2"
percent-encoding = "2"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros"] }
tonic = { version = "0.13", default-features = false, features = ["transport", "codegen", "prost"] }
tonic-build = "0.13"
tokio-tungstenite = { version = "0.26", features = ["connect", "handshake"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "process", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v7"] }
wiremock = "0.6"

[profile.release]
lto = "thin"
strip = true
